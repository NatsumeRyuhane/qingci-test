[project]
name = "copilot"
version = "0.1.0"
description = "面向中文客服的日语客服坐席助手（后端）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "defusedxml>=0.7.1",
    "fastapi>=0.165.0",
    "openai>=3.60.0",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.1.9",
    "typer>=0.29.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
copilot = "copilot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/copilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
# 后端包在 backend/ 下，告诉 ruff 的 import 排序 copilot 是第一方包。
src = ["backend"]
# deploy/ 的运维脚本在服务器自带的 Python 3 上运行（不一定是 3.12），按 3.9 检查语法。
per-file-target-version = { "deploy/**/*.py" = "py39" }

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# 中文注释和字符串里的全角标点是有意的，不当作“易混淆字符”报错。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# live 测试调用真实 LLM 端点，默认不运行；用 `pytest -m live` 运行（见 AGENTS.md 第 8 节）。
addopts = "-ra --strict-markers -m 'not live'"
markers = ["live: 调用真实 LLM 端点，需要配置 LLM_* 环境变量"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "types-openpyxl>=3.1.5.20261122",
    "types-pyyaml>=6.0.12.20261122",
]
