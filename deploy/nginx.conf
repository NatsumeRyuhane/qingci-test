# 提供前端静态文件，并把 /v1 反向代理到后端。
# 与开发时 Vite 代理的行为一致（frontend/vite.config.ts）：前后端同源，不需要 CORS。

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # 用 Docker 内置 DNS 动态解析 backend：后端容器重建后 IP 会变，
    # 写死在 proxy_pass 里会让 nginx 一直连旧地址，直到它自己也重启。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location /v1/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 起草等接口要等 LLM 返回（单次超时 LLM_TIMEOUT_SECONDS，还可能重试）。
        proxy_read_timeout 300s;
        client_max_body_size 10m;
    }

    # 带哈希的打包产物可以长期缓存。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 单页应用：未知路径都回到 index.html，且 index.html 不缓存，保证更新后立即生效。
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
