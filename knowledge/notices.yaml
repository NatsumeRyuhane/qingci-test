    title_zh: App Store 故障导致付费道具无法购买或未到账
    description_zh: >-
      2024 年 3 月 2 日 11:00–14:00 前后，App Store 的故障导致购买付费道具时显示错误、无法购买，
      或购买后道具没有到账。故障已经解除，可以正常购买；没有到账的道具已经发放到玩家的账号中。
      玩家填写的问题发生时间不可信，只决定候选，不决定补偿（提案 0003 §9）。
    event_start: "2024-03-02T11:00:00+09:00"
