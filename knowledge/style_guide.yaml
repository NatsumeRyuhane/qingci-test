# 风格指南：回复的固定结构与措辞（docs/data.md 关键发现 3，D-011）。
#
# 结构：问候 →（致歉）→ 答复（模板）→（请再次联系）→ 结尾 → 禁止转载声明。
# 这些是运营方的固定措辞，不含玩家写的内容。样本中措辞是固定的，所以不做版本和有效期；
# 运营方告知措辞会变化时再考虑。问候语、结语、禁止转载声明必须与导入步骤识别客服回复时用的
# 固定措辞一致（copilot/ingest/text.py，load_knowledge 会检查）。
#
# 多数模板的正文已经以致歉开头、以“请再次联系”结尾；起草（#6）时不要重复添加。

schema_version: 1

greeting:
  ja: "いつもご利用いただきありがとうございます。\n『ぽちゃガチョ！』サポート担当です。"
  zh: 开头的固定问候语，每封回复都用，原样放在最前面。

apologies:
  - ja: お客様にご迷惑をおかけし、誠に申し訳ございません。
    zh: 通用的致歉，用于故障、购买问题等给玩家带来麻烦的情况。
  - ja: お客様にはご不便をおかけしており、誠に申し訳ございません。
    zh: 问题仍在持续、玩家暂时无法正常使用时的致歉。
  - ja: この度はお問い合わせのご面倒をおかけし、申し訳ございません。
    zh: 为让玩家特意来咨询致歉，用于规格说明、显示不清楚等情况。
  - ja: この度はご案内までにお時間を頂戴し、誠に申し訳ございません。
    zh: 回复晚了时的致歉。
  - ja: ゲームの表示がわかりづらく、お客様に混乱をお招きし誠に申し訳ございません。
    zh: 游戏内的显示或说明不够清楚、让玩家误解时的致歉，放在答复之后。

contact_again:
  - ja: その他にもお困りごとやお気づきの点がございましたら、お気軽にお問い合わせください。
    zh: 欢迎今后有其他问题时再联系。答复已经完整时使用。
  - ja: なお、上記お試しいただいたうえで問題が解決しない場合には、大変お手数をおかけいたしますが再度お問い合わせいただけないでしょうか。
    zh: 请玩家尝试某种方法，如果仍未解决再联系。答复是排查方法时使用。

closing:
  ja: 今後とも『ぽちゃガチョ！』をよろしくお願いいたします。
  zh: 结尾的固定结语，每封回复都用。

notice:
  ja: ※本メール内容の無断掲載、無断複製、転送はお控えください。
  zh: 禁止转载声明，放在结语之后，每封回复都用。
