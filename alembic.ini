# 仅供开发时用 Alembic 命令行生成迁移，例如：
#   uv run alembic revision --autogenerate -m "新增 cases 表"
# 应用迁移请用 `copilot db upgrade`，它不依赖本文件，在容器中也能用。
# 数据库 URL 来自 DATABASE_URL（见 .env.example），不在本文件中配置。

[alembic]
script_location = backend/copilot/storage/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
